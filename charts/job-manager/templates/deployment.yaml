apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "job-manager.fullname" . }}
  labels:
    {{- include "job-manager.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "job-manager.selectorLabels" . | nindent 6 }}
  strategy:
    type: Recreate
  template:
    metadata:
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "job-manager.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets | default .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "job-manager.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if (tpl (.Values.extraCertsBundle.configmapName | default .Values.global.extraCertsBundle.configmapName) .) }}
      volumes:
      - configMap:
          name: {{ tpl (.Values.extraCertsBundle.configmapName | default .Values.global.extraCertsBundle.configmapName) . }}
        name: extra-certs-bundle
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
          - name: DB_PASSWORD
            valueFrom:
              secretKeyRef:
                name: {{ .Release.Name }}-jobmanager-mysql
                key: mysql-root-password
          envFrom:
          - configMapRef:
              name: {{ include "job-manager.fullname" . }}-configmap
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /jobmanager/healthz
              port: http
          readinessProbe:
            httpGet:
              path: /jobmanager/healthz
              port: http
          {{- if (tpl (.Values.extraCertsBundle.configmapName | default .Values.global.extraCertsBundle.configmapName) .) }}
          volumeMounts:
          - mountPath: /etc/ssl/certs/icos-extra-cets.crt
            name: extra-certs-bundle
            subPath: {{ tpl (.Values.extraCertsBundle.configmapKey | default .Values.global.extraCertsBundle.configmapKey) . }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
