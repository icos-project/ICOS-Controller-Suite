# Default values for job-manager.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global: {}

replicaCount: 1

image:
  repository: harbor.res.eng.it/icos/meta-kernel/job-manager
  pullPolicy: IfNotPresent

nameOverride: "icos"
fullnameOverride: "icos-jobmanager"

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: "icos-jobmanager"

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

service:
  type: ClusterIP
  nodePort:
  port: 8082

ingress:
  enabled: false

configMap:
  dbDriver: mysql
  dbHost: "{{ .Release.Name }}-jobmanager-mysql"
  dbName: jobmanager
  #dbPassword: '{{ index (lookup "v1" "Secret" .Release.Namespace (printf "%s-jobmanager-mysql" .Release.Name)).data "mysql-root-password" | b64dec }}'
  dbPort: 3306
  dbUser: root
  serverPort: 8082
  lighthouseBaseUrl: http://lighthouse-url/
  matchmakingUrl: http://matchmaking-url/
  keycloakPublicKey: oauth2-server-public-key
  policyManagerUrl: "http://policy-manager-url"
  prettyprint: "false"
  keycloakBaseUrl: http://keycloak-url/
  keycloakRealm: realm
  keycloakClientId: client-id
  keycloakClientSecret: client-secret

resources: {}
  # We usually recommend not to specify default resources and to leave this as a conscious
  # choice for the user. This also increases chances charts run on environments with little
  # resources, such as Minikube. If you do want to specify resources, uncomment the following
  # lines, adjust them as necessary, and remove the curly braces after 'resources:'.
  # limits:
  #   cpu: 100m
  #   memory: 128Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
  # targetMemoryUtilizationPercentage: 80

nodeSelector: {}

tolerations: []

affinity: {}

mysql:
  nameOverride: jobmanager-mysql
  auth:
    database: jobmanager
    password: unused-set-by-the-secret
    rootPassword: unused-set-by-the-secret
    existingSecret: "{{ .Release.Name }}-jobmanager-mysql"

extraCertsBundle:
  configmapName: ""
  configmapKey: ""
