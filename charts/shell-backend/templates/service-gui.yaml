{{- if .Values.gui.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "shell-backend.fullname" . }}-gui
  labels:
    {{- include "shell-backend-gui.labels" . | nindent 4 }}
spec:
  type: {{ .Values.gui.service.type }}
  ports:
    - port: {{ .Values.gui.service.port }}
      targetPort: http
      protocol: TCP
      name: http
      {{- if and (eq .Values.gui.service.type "NodePort") (not (empty .Values.service.nodePort)) }}
      nodePort: {{ .Values.gui.service.nodePort }}
      {{- end }}
  selector:
    {{- include "shell-backend-gui.selectorLabels" . | nindent 4 }}
{{- end }}
