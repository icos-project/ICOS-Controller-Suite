{{- if and (index .Values "telemetruum-hub" "grafana" "enabled") (eq .Values.global.controller.routing "path") -}}
{{- if .Values.global.controller.telemetry.exposeGrafana -}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
      cert-manager.io/issuer: icos-step-ca-issuer
      cert-manager.io/issuer-group: certmanager.step.sm
      cert-manager.io/issuer-kind: StepClusterIssuer
      #nginx.ingress.kubernetes.io/rewrite-target: /
  name: {{ .Release.Name }}-grafana-ingress
spec:
  ingressClassName: icos-ingress-controller
  rules:
    {{- if regexMatch "(?:[0-9]{1,3}\\.){3}[0-9]{1,3}$" ( tpl .Values.global.controller.host .) }}
    - http:
    {{- else }}
    - host: {{ tpl .Values.global.controller.host . }}
      http:
    {{- end }}
        paths:
        - path: {{ tpl .Values.global.controller.telemetry.grafanaExternalPath . }}
          pathType: Prefix
          backend:
            service:
              name: {{ tpl .Values.global.controller.telemetry.grafanaInternalHost . }}
              port:
                number: {{ .Values.global.controller.telemetry.grafanaInternalPort }}
{{- if eq (tpl .Values.global.controller.telemetry.grafanaExternalProtocol .) "https" }}
  tls:
  - hosts:
    - {{ tpl .Values.global.controller.host . }}
    secretName: {{ .Release.Name }}-ingress-tls
{{- end }}
{{- end }}
{{- end }}